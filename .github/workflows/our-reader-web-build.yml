name: Our Reader web build

# Type-checked web build of the Our Reader fork (apps/readest-app).
# This is the build proof that cannot run on the small local VM
# (the TypeScript phase OOMs there). No deploy, no secrets needed.
on:
  push:
    branches: [main]
    paths:
      - 'apps/readest-app/**'
      - '.github/workflows/our-reader-web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/readest-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Set up vendors
        run: pnpm --filter @readest/readest-app setup-vendors
        working-directory: .
      - name: Build web (with full TypeScript check)
        run: pnpm build-web
        env:
          SELF_HOSTED: 'true'
